<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1a">
<title>فرص السوق الأمريكي</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1a; --card:#121a2b; --line:rgba(255,255,255,.08);
    --text:#f0f4fc; --muted:#93a0bb; --dim:#5c6885;
    --up:#16d492; --down:#fb5573; --accent:#5b8dff; --amber:#f5b43c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:"Tajawal",Tahoma,sans-serif;
       padding:clamp(14px,3vw,26px);max-width:1000px;margin:0 auto;padding-bottom:50px}

  /* الهيدر */
  h1{font-size:clamp(19px,3.4vw,24px);font-weight:900;margin-bottom:10px}
  .bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;margin-inline-end:6px}
  .dot.on{background:var(--up);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,212,146,.5)}70%{box-shadow:0 0 0 7px rgba(22,212,146,0)}}
  .st.open{color:var(--up);font-weight:800} .st.closed{color:var(--dim);font-weight:800}
  .fresh{font-weight:700} .fresh.old{color:var(--amber)}

  /* تنبيه جلسة قديمة */
  .warn{display:none;margin:14px 0 0;padding:13px 15px;border-radius:12px;font-size:13.5px;
        font-weight:700;line-height:1.7;background:rgba(245,180,60,.13);
        border:1px solid rgba(245,180,60,.45);color:var(--amber)}
  .warn.show{display:block}

  /* العدّاد الكبير */
  .big{margin:20px 0 14px;font-size:15px;color:var(--muted)}
  .big b{font-size:34px;font-weight:900;color:var(--up);margin-inline-end:8px;font-variant-numeric:tabular-nums}

  /* التبويبان */
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;background:var(--card);border:1px solid var(--line);color:var(--muted);
       padding:12px;border-radius:13px;cursor:pointer;font-size:14.5px;font-family:inherit;
       font-weight:700;transition:.15s}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab small{display:block;font-size:11.5px;font-weight:500;margin-top:2px;opacity:.85}

  /* البطاقات */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px 18px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .tkr{font-size:20px;font-weight:900;letter-spacing:.5px;direction:ltr}
  .day{font-size:14px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
  .day.u{color:var(--up)} .day.d{color:var(--down)}
  .px{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;
      display:inline-block;padding:1px 6px;margin-inline-start:-6px;border-radius:8px;
      transition:background .5s}
  .px.up{background:rgba(22,212,146,.15)} .px.down{background:rgba(251,85,115,.15)}
  .lvl{margin-top:13px;font-size:13.5px;font-weight:700;color:var(--up);
       background:rgba(22,212,146,.1);border-radius:10px;padding:10px 13px;direction:rtl}
  .lvl b{direction:ltr;font-variant-numeric:tabular-nums}
  .lvl.verge{color:var(--amber);background:rgba(245,180,60,.1)}
  .prog{display:flex;gap:4px;margin-top:12px}
  .prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.09)}
  .prog i.on{background:var(--up)}
  .next{margin-top:9px;font-size:12.5px;color:var(--muted);direction:rtl}
  .next b{color:var(--text);direction:ltr;font-variant-numeric:tabular-nums}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);font-size:15px;line-height:1.9}
  .empty span{display:block;font-size:40px;margin-bottom:10px;opacity:.6}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
         font-size:12px;color:var(--dim);text-align:center;line-height:1.8}
  footer a{color:var(--accent);text-decoration:none}
  @media(max-width:560px){.cards{grid-template-columns:1fr}.px{font-size:26px}}
</style>
</head>
<body>

<h1>فرص السوق الأمريكي</h1>
<div class="bar">
  <span><span class="dot" id="dot"></span><span class="st" id="mkt">—</span></span>
  <span id="fresh" class="fresh">—</span>
  <span id="sess" style="color:var(--dim)"></span>
</div>

<div id="warn" class="warn"></div>

<div class="big" id="count"></div>

<div class="tabs">
  <button class="tab on" data-f="buy">🟢 فرص الآن<small>اخترقت مستوى الشراء</small></button>
  <button class="tab" data-f="verge">🔸 على وشك<small>قريبة من الاختراق</small></button>
</div>

<div class="cards" id="cards"></div>

<footer>
  استراتيجية شمعة الافتتاح · الأسعار مباشرة · <a id="newsLink" href="#" onclick="return false">أخبار السوق</a><br>
  أداة تحليل فقط وليست توصية استثمارية
</footer>

<script>
"use strict";

/* ═══ الوقت وحالة السوق ═══ */
const fD=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false});
const fNyDate=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"});
const todayNY=()=>fNyDate.format(new Date());
function marketOpen(){
  const p=Object.fromEntries(fD.formatToParts(new Date()).map(x=>[x.type,x.value]));
  if(p.weekday==="Sat"||p.weekday==="Sun") return false;
  const m=(+p.hour)*60+(+p.minute);
  return m>=570 && m<960;
}
setInterval(()=>{
  const o=marketOpen();
  document.getElementById("mkt").textContent=o?"السوق مفتوح":"السوق مغلق";
  document.getElementById("mkt").className="st "+(o?"open":"closed");
  document.getElementById("dot").className="dot"+(o?" on":"");
},1000);

/* ═══ الحالة ═══ */
let DATA=null, filter="buy";
const live={}, els={};
const money=n=>"$"+Number(n).toFixed(2);
const pct=n=>(n>=0?"+":"")+Number(n).toFixed(2)+"%";

async function load(){
  try{
    const r=await fetch("results.json?v="+Date.now(),{cache:"no-store"});
    DATA=await r.json(); draw(); subscribe();
  }catch(e){ document.getElementById("fresh").textContent="تعذّر التحميل"; }
}
setInterval(load,45000);

/* الأسهم القريبة من الاختراق (لم تدخل صفقة، تحت القمة بـ0.6% وفوق VWAP) */
function vergeList(){
  if(!DATA) return [];
  return DATA.all.filter(r=>{
    if(r.state!==0) return false;
    const px=live[r.ticker]?.price ?? r.price;
    const gap=(r.open_high-px)/px;
    return gap>0 && gap<=0.006 && px>r.vwap;
  }).map(r=>({...r,_px:live[r.ticker]?.price ?? r.price,_gap:(r.open_high/(live[r.ticker]?.price ?? r.price)-1)*100}))
    .sort((a,b)=>a._gap-b._gap);
}

function draw(){
  if(!DATA) return;
  const d=DATA;

  // نضارة البيانات
  const ago=Math.max(0,Math.round((Date.now()-Date.parse(d.updated_ny.replace(" ","T")+"-04:00"))/60000));
  const fresh=document.getElementById("fresh");
  fresh.textContent=`محدّث قبل ${isFinite(ago)?ago:"?"} دقيقة`;
  fresh.className="fresh"+(ago>12?" old":"");
  document.getElementById("sess").textContent="جلسة "+(d.session_date||"—");

  // تحذير جلسة قديمة
  const stale=d.session_date && d.session_date!==todayNY();
  const warn=document.getElementById("warn");
  warn.className="warn"+(stale?" show":"");
  if(stale) warn.innerHTML=`⚠️ هذه أرقام جلسة <b>${d.session_date}</b> وليست اليوم. شغّل <b>start.bat</b> على جهازك ليتحدّث.`;

  const vn=vergeList().length;
  document.getElementById("count").innerHTML = filter==="buy"
    ? `<b>${d.buy_count}</b> فرصة شراء نشطة الآن`
    : `<b>${vn}</b> سهم على وشك الاختراق`;

  let list = filter==="buy" ? d.opportunities : vergeList();
  // فرص الشراء: الأحدث إشارةً أولاً (الطازج عند الافتتاح)
  if(filter==="buy") list=[...list].sort((a,b)=>(a.bars_since_signal??999)-(b.bars_since_signal??999));

  for(const k in els) delete els[k];

  if(!list.length){
    document.getElementById("cards").innerHTML = filter==="buy"
      ? `<div class="empty"><span>⏳</span>ما في فرص شراء الآن.<br>الإشارات تبدأ بالظهور بعد ~10 دقائق من فتح السوق.</div>`
      : `<div class="empty"><span>🔍</span>ما في سهم قريب من الاختراق حالياً.</div>`;
    return;
  }

  document.getElementById("cards").innerHTML=list.map(r=>{
    const px=live[r.ticker]?.price ?? r.price;
    if(filter==="verge"){
      return `<div class="card">
        <div class="top"><span class="tkr">${r.ticker}</span></div>
        <span class="px" id="p-${r.ticker}">${money(px)}</span>
        <div class="lvl verge">🔸 باقي <b>${(r._gap).toFixed(2)}%</b> ليخترق الشراء فوق <b>${money(r.open_high)}</b></div>
      </div>`;
    }
    // الأهداف من مقياس "أعلى ما وصل" (targets_hit) لا من السعر الحالي — فلا تتراجع
    const bars=r.targets.map((t,i)=>`<i class="${i<r.targets_hit?"on":""}"></i>`).join("");
    const nt=r.targets_hit<r.targets.length ? r.targets[r.targets_hit] : null;
    return `<div class="card">
      <div class="top">
        <span class="tkr">${r.ticker}</span>
        <span class="day ${r.day_change_pct>=0?"u":"d"}" id="c-${r.ticker}">${pct(r.day_change_pct)}</span>
      </div>
      <span class="px" id="p-${r.ticker}">${money(px)}</span>
      <div class="lvl">🟢 اخترق الشراء فوق <b>${money(r.open_high)}</b></div>
      <div class="prog" id="pr-${r.ticker}">${bars}</div>
      <div class="next" id="nx-${r.ticker}">${nt?`الهدف القادم: <b>${money(nt)}</b>`:"✅ تجاوز كل الأهداف"}</div>
    </div>`;
  }).join("");

  list.forEach(r=>{
    els[r.ticker]={p:document.getElementById("p-"+r.ticker),c:document.getElementById("c-"+r.ticker),
                   pr:document.getElementById("pr-"+r.ticker),nx:document.getElementById("nx-"+r.ticker),
                   targets:r.targets,hw:r.targets_hit,last:live[r.ticker]?.price ?? r.price};
  });
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); filter=t.dataset.f; draw();
});

/* ═══ أخبار (نافذة بسيطة عند الطلب) ═══ */
document.getElementById("newsLink").onclick=async()=>{
  try{
    const n=await (await fetch("news.json?v="+Date.now(),{cache:"no-store"})).json();
    const top=(n.items||[]).slice(0,12).map(i=>`• ${i.title}  (${i.source})`).join("\n\n");
    alert(top||"لا توجد أخبار الآن");
  }catch(e){ alert("تعذّر تحميل الأخبار"); }
  return false;
};

/* ═══ البث المباشر للأسعار ═══ */
let ws=null, retry=2000;
function decode(b64){
  const raw=atob(b64), buf=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) buf[i]=raw.charCodeAt(i);
  let pos=0; const out={};
  const vi=()=>{let r=0n,s=0n;for(;;){const b=buf[pos++];r|=BigInt(b&127)<<s;if(!(b&128))return r;s+=7n;if(pos>buf.length)throw 0;}};
  while(pos<buf.length){
    const tag=Number(vi()), f=tag>>3, w=tag&7;
    if(w===0) vi();
    else if(w===1) pos+=8;
    else if(w===5){ const v=new DataView(buf.buffer,pos,4).getFloat32(0,true); pos+=4;
      if(f===2)out.price=v; else if(f===8)out.chg=v; }
    else if(w===2){ const n=Number(vi()); if(f===1) out.id=new TextDecoder().decode(buf.subarray(pos,pos+n)); pos+=n; }
    else break;
  }
  return out;
}
const timers={};
function paint(id,q){
  const e=els[id]; if(!e) return;
  const dir=q.price>e.last?1:q.price<e.last?-1:0; e.last=q.price;
  if(e.p){
    e.p.textContent=money(q.price);
    if(dir){ e.p.classList.remove("up","down"); void e.p.offsetWidth;
      e.p.classList.add(dir>0?"up":"down");
      clearTimeout(timers[id]); timers[id]=setTimeout(()=>e.p.classList.remove("up","down"),600); }
  }
  if(e.c && q.chg!==undefined){ e.c.textContent=pct(q.chg); e.c.className="day "+(q.chg>=0?"u":"d"); }
  // الأهداف مقياس "أعلى ما وصل": تزيد فقط لو حقّق السعر الحي هدفاً جديداً، ولا تتراجع
  if(e.pr && e.targets){
    const liveHits=e.targets.filter(t=>q.price>=t).length;
    e.hw=Math.max(e.hw||0, liveHits);
    [].forEach.call(e.pr.children,(el,i)=>el.className=i<e.hw?"on":"");
    if(e.nx){ const nt=e.hw<e.targets.length ? e.targets[e.hw] : null;
      e.nx.innerHTML = nt?`الهدف القادم: <b>${money(nt)}</b>`:"✅ تجاوز كل الأهداف"; }
  }
}
function subscribe(){ if(ws&&ws.readyState===1&&DATA) ws.send(JSON.stringify({subscribe:DATA.all.map(r=>r.ticker)})); }
function connect(){
  try{ ws=new WebSocket("wss://streamer.finance.yahoo.com/?version=2"); }catch(e){ return; }
  ws.onopen=()=>{ retry=2000; subscribe(); };
  ws.onmessage=ev=>{ try{
    let b=ev.data; if(typeof b==="string"&&b[0]==="{"){ const j=JSON.parse(b); b=j.message||j.data||""; }
    if(!b) return; const q=decode(b);
    if(q.id&&q.price){ live[q.id]={price:q.price,chg:q.chg}; paint(q.id,live[q.id]); }
  }catch(e){} };
  ws.onclose=()=>{ setTimeout(connect,retry); retry=Math.min(retry*2,30000); };
  ws.onerror=()=>ws.close();
}

load(); connect();
</script>
<script type="module" src="auth.js"></script>
</body>
</html>
